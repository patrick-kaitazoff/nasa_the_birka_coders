# Solo para Vercel (en local las librerías salen de backend/requirements.txt).
[project]
name = "field-shift"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.160",
    "httpx>=0.28",
    "numpy>=2.3",
    "pandas>=3.0",
    "shapely>=2.1",
    "pillow>=11",
    "openpyxl>=3.1",
    "pypdf>=6.0",
    "python-multipart>=0.0.20",
    "google-genai>=3.0", # el chat con IA (Gemini)
    "vercel>=0.12", # Runtime Cache para el puente remoto (solo pruebas)
]

[tool.vercel]
entrypoint = "main:app"

# /assets (el JS, el CSS y las fotos compilados) sale de la red de Vercel como archivos estáticos, sin pasar por la
# función. Hay que pedirlo: como la app tiene middleware (la contraseña, CORS), Vercel por las dudas deja todo en la
# función. Ojo: con contraseña puesta, lo de /assets queda a la vista igual.
[tool.vercel.fastapi.static]
cdn = true
